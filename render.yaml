services:
  - type: web
    name: code2plain
    runtime: python
    plan: free

    branch: refactor/editor-learning-layer

    buildCommand: |
      python -m pip install --upgrade pip
      python -m pip install -e .

    startCommand: |
      uvicorn code2plain.deployment:app \
        --host 0.0.0.0 \
        --port $PORT

    healthCheckPath: /health

    envVars:
      - key: CODE2PLAIN_DEMO_SECRET
        generateValue: true

    autoDeploy: true
