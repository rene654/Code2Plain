services:
  - type: web
    name: code2plain
    runtime: python
    plan: free

    buildCommand: |
      python -m pip install --upgrade pip
      python -m pip install -e .

    startCommand: |
      uvicorn code2plain.deployment:app \
        --host 0.0.0.0 \
        --port $PORT

    healthCheckPath: /health

    autoDeploy: true
