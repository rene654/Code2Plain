<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Code2Plain</title>

    <link
        rel="stylesheet"
        href="/static/styles.css"
    >
</head>

<body>

    <main class="app">

        <header class="topbar">

            <div class="brand">

                <div class="brand-mark">
                    C2P
                </div>

                <div class="brand-copy">
                    <h1>Code2Plain</h1>

                    <p>
                        Turn code into something you can learn.
                    </p>
                </div>

            </div>


            <div class="topbar-tools">

                <div
                    class="mode-selector"
                    aria-label="Learning mode"
                >

                    <button
                        class="mode active"
                        data-mode="learn"
                    >
                        Learn
                    </button>

                    <button
                        class="mode"
                        data-mode="understand"
                    >
                        Understand
                    </button>

                    <button
                        class="mode"
                        data-mode="deep"
                    >
                        Deep Dive
                    </button>

                </div>


                <button
                    id="explainButton"
                    class="explain-button"
                >
                    Explain code
                </button>

            </div>

        </header>


        <section class="learning-workspace">

            <div class="paper">

                <div class="paper-header">

                    <div>
                        <span class="paper-kicker">
                            STUDY SHEET
                        </span>

                        <h2>
                            Python
                        </h2>
                    </div>

                    <div class="paper-status">

                        <span class="status-dot"></span>

                        <span
                            id="sectionCounter"
                        >
                            Waiting for code
                        </span>

                    </div>

                </div>


                <div
                    id="codeEditor"
                    class="code-editor"
                ></div>


                <textarea
                    id="codeInput"
                    spellcheck="false"
                    aria-label="Python source code"
                >import pandas as pd

df = pd.read_excel("orders.xlsx")

late_orders = df[df["status"] == "Late"]

summary = late_orders.groupby("supplier")["amount"].sum()

summary.to_excel("late_orders.xlsx")</textarea>

            </div>


            <aside
                id="learningNote"
                class="learning-note hidden"
            >

                <div class="note-pin"></div>


                <div class="note-header">

                    <div
                        id="noteNumber"
                        class="note-number"
                    >
                        01
                    </div>

                    <div>

                        <span class="note-kicker">
                            CURRENT IDEA
                        </span>

                        <h3
                            id="noteTitle"
                        >
                            IMPORT
                        </h3>

                    </div>

                </div>


                <div
                    id="noteCode"
                    class="note-code"
                ></div>


                <div
                    id="conceptVisual"
                    class="concept-visual"
                ></div>


                <div class="note-section">

                    <span
                        id="primaryLabel"
                        class="note-label"
                    >
                        WHAT IT DOES
                    </span>

                    <p
                        id="notePrimary"
                        class="note-primary"
                    ></p>

                </div>


                <div class="note-section">

                    <span
                        id="secondaryLabel"
                        class="note-label"
                    >
                        LEARN
                    </span>

                    <p
                        id="noteSecondary"
                    ></p>

                </div>


                <div
                    id="technicalSection"
                    class="note-section technical hidden"
                >

                    <span class="note-label">
                        TECHNICAL NOTE
                    </span>

                    <p
                        id="noteTechnical"
                    ></p>

                </div>


                <div class="note-footer">

                    <span
                        id="noteLines"
                    ></span>

                    <span>
                        Pick another block →
                    </span>

                </div>

            </aside>

        </section>


        <footer class="study-footer">

            <div>
                <span class="footer-dot"></span>

                Click any numbered code block to study it.
            </div>

            <span>
                Code2Plain Learning Canvas
            </span>

        </footer>

    </main>


    <script src="/static/app.js"></script>

</body>
</html>
